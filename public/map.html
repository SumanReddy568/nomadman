<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where I've shot</title>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  html,body{margin:0;height:100%;background:#0d1320;font-family:'Inter',system-ui,sans-serif;overflow:hidden}
  #wrap{position:relative;width:100%;height:100%}
  svg{display:block;width:100%;height:100%}
  .label{font-family:'Fira Code',ui-monospace,monospace;font-size:10.5px;letter-spacing:.06em;fill:#9ca3af;text-transform:uppercase;pointer-events:none;opacity:0;transition:opacity .5s ease}
  .label.on{opacity:1}
  .dot{cursor:pointer}
  .halo{fill:#3b82f6;opacity:.28}
  @keyframes pulse{0%{r:4;opacity:.5}70%{r:16;opacity:0}100%{r:16;opacity:0}}
  @media (prefers-reduced-motion: reduce){ .halo{animation:none !important} }
</style>
</head>
<body>
<div id="wrap"><svg></svg></div>
<script>
// Markers come from the same trips.json the parent page reads, so adding a
// trip puts a pin on the map with no edit here.
const svg = d3.select('svg');
let world = null, TRIPS = [];

function draw(){
  const el = document.getElementById('wrap');
  const w = el.clientWidth, h = el.clientHeight;
  if (!world || !TRIPS.length || !w || !h) return;
  svg.selectAll('*').remove();
  svg.attr('viewBox', `0 0 ${w} ${h}`);
  const proj = d3.geoNaturalEarth1().fitExtent([[24, 24],[w-24, h-24]], world);
  const path = d3.geoPath(proj);

  const g = svg.append('g');
  g.append('g').selectAll('path').data(world.features).join('path')
    .attr('d', path).attr('fill','#1b2434').attr('stroke','#0d1320').attr('stroke-width',.7);

  // graticule for a quiet cartographic texture
  g.insert('path', ':first-child').datum(d3.geoGraticule10())
    .attr('d', path).attr('fill','none').attr('stroke','#151d2b').attr('stroke-width',.6);

  const pts = g.append('g');
  TRIPS.forEach((t, i) => {
    const [x,y] = proj([t.lon, t.lat]);
    const grp = pts.append('g').attr('class','dot').attr('transform',`translate(${x},${y})`)
      .style('opacity',0);
    grp.append('circle').attr('class','halo').attr('r',4)
      .style('animation', `pulse 3.2s ${i*0.45}s ease-out infinite`);
    grp.append('circle').attr('r',3.4).attr('fill','#60a5fa')
      .attr('stroke','#0d1320').attr('stroke-width',1);
    const lab = grp.append('text').attr('class','label').attr('x',10).attr('y',3.5)
      .text(t.marker || t.place);
    grp.append('circle').attr('r',18).attr('fill','transparent')
      .on('mouseenter', () => lab.attr('class','label on'))
      .on('mouseleave', () => lab.attr('class','label'))
      .on('click', () => parent.postMessage({type:'trip', id:t.id}, location.origin));
    grp.transition().delay(320 + i*160).duration(900).style('opacity',1)
      .on('end', () => { if (i % 2 === 0) lab.attr('class','label on'); });
  });
}

Promise.all([
  d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json'),
  fetch('trips.json').then(r => r.json()),
]).then(([topo, cfg]) => {
  world = topojson.feature(topo, topo.objects.countries);
  TRIPS = (cfg.trips || []).filter(t => Number.isFinite(t.lat) && Number.isFinite(t.lon));
  draw();
});
addEventListener('resize', () => { clearTimeout(window.__t); window.__t = setTimeout(draw, 150); });
</script>
</body>
</html>
